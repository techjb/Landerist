name: Build and architecture

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build ./Landerist.sln --configuration Release --verbosity minimal

      - name: Test unit suite
        run: >-
          dotnet test
          ./landerist_unit_tests/landerist_unit_tests.csproj
          --configuration Release
          --no-build
          --verbosity minimal

      - name: Test architecture boundaries
        run: >-
          dotnet test
          ./landerist_architecture_tests/landerist_architecture_tests.csproj
          --configuration Release
          --no-build
          --verbosity minimal
