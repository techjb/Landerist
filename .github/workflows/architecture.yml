name: Architecture

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test architecture boundaries
        run: >-
          dotnet test
          ./landerist_architecture_tests/landerist_architecture_tests.csproj
          --configuration Release
          --verbosity minimal
